<!DOCTYPE html>
<!-- Local stand-in for facebook.com / messenger.com used by the browser tests.
     It imitates the page structure (banner, navigation, an infinitely loading
     feed) but loads nothing from the network. -->
<html lang="en" id="facebook" dir="ltr">
<head>
<meta charset="utf-8">
<title>Facebook (local test fixture)</title>
<style>
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; }
  [role="banner"] { position: sticky; top: 0; height: 56px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); display: flex; align-items: center; padding: 0 16px; }
  [role="main"] { max-width: 680px; margin: 16px auto; }
  [role="article"] { background: #fff; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; min-height: 120px; }
</style>
</head>
<body class="_6s5d _71pn system-fonts--body">
<div id="mount_0_0_xy">
  <div role="banner"><a aria-label="Facebook" href="/">facebook</a>
    <div role="navigation" aria-label="Facebook"><a href="/watch/">Watch</a> <a href="/marketplace/">Marketplace</a> <a href="/messages/t/">Messenger</a></div>
  </div>
  <div role="main">
    <h3 dir="auto">News Feed posts</h3>
    <div role="feed" data-testid="feed"></div>
  </div>
</div>
<script>
  // Imitate a feed that keeps loading posts after the page has loaded.
  const feed = document.querySelector('[role="feed"]');
  let posts = 0;
  function addPost() {
    const article = document.createElement('div');
    article.setAttribute('role', 'article');
    article.setAttribute('aria-posinset', String(++posts));
    const author = document.createElement('h4');
    author.textContent = `Friend ${posts}`;
    const text = document.createElement('div');
    text.setAttribute('data-ad-preview', 'message');
    text.textContent = 'Look at this thing I had for lunch.';
    article.append(author, text);
    feed.append(article);
  }
  for (let i = 0; i < 3; i++) addPost();
  setInterval(addPost, 500);
</script>
</body>
</html>
