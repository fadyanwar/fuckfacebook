<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily time limit — Fuck Facebook</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 32px 20px; }
    main { max-width: 520px; margin: auto; }
    h1 { color: #ef5350; }
    label { display: block; font-weight: bold; margin-top: 24px; }
    input { display: block; padding: 10px; margin: 8px 0; width: 140px; font: inherit; }
    button { padding: 10px 18px; margin: 12px 8px 0 0; font: inherit; cursor: pointer; }
    #status { min-height: 1.6em; }
  </style>
</head>
<body>
  <main>
    <h1>Daily time limit</h1>
    <p>Choose how long you can spend on Facebook and Messenger each day. The allowance is shared across both sites and resets at midnight.</p>
    <form id="settings">
      <label for="minutes">Daily allowance in minutes</label>
      <input id="minutes" name="minutes" type="number" min="1" max="1440" step="1" value="60" required aria-describedby="hint" disabled>
      <p id="hint">Default: 60 minutes (one hour). Changes keep today’s recorded usage.</p>
      <button id="save" type="submit" disabled>Save</button>
      <button id="reset" type="button" disabled>Reset to one hour</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
